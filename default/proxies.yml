# External API declaration. Declare domains your app needs to reach.
# At install time, admins see exactly which endpoints the app will use.
#
# Cross-workspace search: to search across other Cribl.Cloud workspaces the app
# acts as an org-level control-plane client. This file declares the two fixed
# domains:
#   - login.cribl.cloud  — OAuth client-credentials token exchange
#   - api.cribl.cloud    — org-level workspace listing
# Per-workspace leader FQDNs (e.g. main-<org>.cribl.cloud) can't be wildcarded
# and aren't known at pack time, so they are APPENDED automatically at packaging
# time from config/xws-workspaces.json (see scripts/pkgutil.mjs composeProxiesYml).
# Don't add leader hosts here by hand — edit that JSON and repack instead.

# OAuth token endpoint. No injected auth — client_id/secret travel in the body.
login.cribl.cloud:
  paths:
    allowlist:
      - /oauth/token
  headers:
    allowlist:
      - Content-Type
      - Accept
  timeout: 30000
  rejectUnauthorized: true

# Cribl.Cloud org-level API. The app cannot set Authorization directly (the
# proxy strips it), so the Bearer token is injected from the app KV store.
# The app writes the freshly-minted token to KV key `xwsAccessToken` first.
api.cribl.cloud:
  paths:
    allowlist:
      - /v2/organizations/
  headers:
    inject:
      Authorization: "'Bearer ' + kv.xwsAccessToken"
    allowlist:
      - Content-Type
      - Accept
  timeout: 30000
  rejectUnauthorized: true

# --- Auto-generated cross-workspace leader hosts ---
# Source: config/xws-workspaces.json. Do not edit by hand; change that file
# (add/remove workspace names) and repack to regenerate.
nelnetmigration-clever-wright-uno1ans.cribl.cloud:
  paths:
    allowlist:
      - /api/v1/products/stream/groups
      - /api/v1/m/
  headers:
    inject:
      Authorization: "'Bearer ' + kv.xwsAccessToken"
    allowlist: [Content-Type, Accept]
  timeout: 30000
  rejectUnauthorized: true
verizon-clever-wright-uno1ans.cribl.cloud:
  paths:
    allowlist:
      - /api/v1/products/stream/groups
      - /api/v1/m/
  headers:
    inject:
      Authorization: "'Bearer ' + kv.xwsAccessToken"
    allowlist: [Content-Type, Accept]
